# Engineering fixture only. Capacities, dimensions, costs and target geometry are unreviewed test inputs.
title = "Infinite Spell · playable study (unreviewed)"
description = "Explicit authored selection, physical wand/cartridge custody and finite energy. In-memory session; no durable world save."
actor = "actor"
equipment_slot = "hand"
muzzle_offset = 0.7
floor = 0.0

[[spells]]
id = "bolt"
definition = "../spells/casting-study/bolt.spell.yaml"
[[spells]]
