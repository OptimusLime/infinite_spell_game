[[inventory.items]]
item = { id = "blue", definition = "study-cartridge", footprint = { size = { width = 1, height = 1 }, rotatable = true } }
location = { kind = "grid", grid = "pack", column = 1, row = 1, orientation = "normal" }

[equipment]
