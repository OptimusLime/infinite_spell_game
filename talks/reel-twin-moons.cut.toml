# Reel v4 (r/aigamedev): a re-edit of v3's real engine clips (storyboard/reel/clips/, rendered offline at 30 fps),
# hard cuts, no narration, one line of text: the title, small, cut in on the fireball's impact frame. Silent: the
# engine has no music bed to give it. No black tail: it ends on the impact.
# Recording paths are relative to the project (the game repo), as the engine reads them.
# Render (from a copy of the game repo): app video make talks/reel-twin-moons.cut.toml --orientation landscape
# (make-reel-pieces.py makes the title shot into .atelico/reel-pieces/)
# Out: .atelico/reel-twin-moons/landscape.mp4 -> storyboard/exports/reel-twin-moons-v4.mp4
name = "reel-twin-moons"
title = "Reel: twin moons"
# no shot needs checklist ids; the cut format requires the field
checklist = "../storyboard/path.toml"
captions = "file"
ground = "dark"
order = ["twin-moon-timelapse", "watchtower-moon", "editor-look", "ink-firefall", "founding", "twin-moons", "brood", "fireball-launch", "impact-title"]

[voices]
engine = "http://127.0.0.1:8187/v1"
transcriber = "in-memory::whisper-small.en"
narrator = { model = "in-memory::qwen3-tts", voice = "nyc", speed = 1.25, language = "en" }
user = { model = "in-memory::pocket-tts", voice = "michael", speed = 1.2 }

[timing]
fps = 30
lead = 0.0
beat = 0.0

[shot.twin-moon-timelapse]
at = "0:00"
until = "0:04.2"
name = "1. Twin-moon timelapse, pixel: dusk to both moons"
source = { recording = { file = "storyboard/reel/clips/pixel-town-twin-moon-timelapse-dusk-to-both-moons-4.2s.mp4", shows = [] } }

[shot.watchtower-moon]
at = "0:04.2"
until = "0:06.6"
name = "2. The orange moon sat on the watchtower"
source = { recording = { file = "storyboard/reel/clips/pixel-town-watchtower-orange-moon-push-2.4s.mp4", shows = [] } }

[shot.editor-look]
at = "0:06.6"
until = "0:08.3"
name = "3. The look graph: texels 2 to 6, snap"
note = "five captured states of the hidden editor (texels 2, 3, 4, 5, 6), stepped not dragged; cut 0.15 s after 6 lands, a hard snap into the ink town"
source = { recording = { file = "storyboard/reel/clips/editor-look-graph-pixel-lens-texels-2-to-6-snap-1.7s.mp4", shows = [] } }

[shot.ink-firefall]
at = "0:08.3"
until = "0:11.1"
name = "4. Ink: fire falling, the orange moon by the tower"
note = "the style change is a cut out of the editor, not the live pixel-to-ink switch (task 51, not built yet)"
source = { recording = { file = "storyboard/reel/clips/ink-town-firefall-orange-moon-push-2.8s.mp4", shows = [] } }

[shot.founding]
at = "0:11.1"
until = "0:14.3"
name = "5. The town founded: the seed in, houses rise"
note = "the ring of light reads small at this distance"
source = { recording = { file = "storyboard/reel/clips/ink-town-founding-dusk-houses-rise-3.2s.mp4", shows = [] } }

[shot.twin-moons]
at = "0:14.3"
until = "0:16.9"
name = "6. Twin moons aligned, fire falling"
note = "kept for length (aim 22 to 28 s)"
source = { recording = { file = "storyboard/reel/clips/ink-town-twin-moons-aligned-firefall-zoom-2.6s.mp4", shows = [] } }

[shot.brood]
at = "0:16.9"
until = "0:19.9"
name = "7. The brood at the seed"
source = { recording = { file = "storyboard/reel/clips/ink-town-brood-climber-at-seed-in-firefall-3s.mp4", shows = [] } }

[shot.fireball-launch]
at = "0:19.9"
until = "0:20.4"
name = "8. Wind then fire: a fireball"
note = "task 75's spell effects"
source = { recording = { file = "storyboard/reel/clips/ink-town-fireball-launch-behind-hero-0.5s.mp4", shows = [] } }

[shot.impact-title]
at = "0:20.4"
until = "0:22.03"
name = "9. The fireball hits a climber; the title"
note = "the title is cut in on the impact frame by make-reel-pieces.py over the real clip ink-town-fireball-impact-on-climber-from-flight-1.6s.mp4 (task 75's spell effects)"
source = { recording = { file = ".atelico/reel-pieces/title-fireball-impact-cut-in-1.6s.mp4", make = "talks/make-reel-pieces.py", shows = ["talks/make-reel-pieces.py"] } }
