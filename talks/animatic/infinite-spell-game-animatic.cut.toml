# The Infinite Spell Game storyboard as an animatic: one shot per card of docs/storyboard/history/path-15-card-day-in-the-life.toml, in its order. Each shot is the
# card's `spoken` line, word for word, voiced by the engine's Qwen3-TTS, over that card's picture with a slow camera
# move (make-card-moves.py draws the move to the shot's voiced length), the card's number and title on the small chip
# bottom left. Recording paths are relative to the project (the game repo), as the engine reads them.
#
# Render (from the game repo):  app video make talks/animatic/infinite-spell-game-animatic.cut.toml --orientation landscape
# When the card-NN stills land:  uv run --with pillow python talks/animatic/make-card-moves.py --render
#   (points each shot at its newest storyboard/sketches/card-NN-*.png, then runs the render above)
# Out: .atelico/infinite-spell-game-animatic/landscape.mp4 and subtitles.srt (make-card-moves.py --render
# copies them to talks/animatic/infinite-spell-game-animatic-<seconds>s.mp4 and .srt).
name = "infinite-spell-game-animatic"
title = "Infinite Spell Game animatic"
# no shot needs checklist ids; the cut format requires the field
checklist = "../../storyboard/path.toml"
captions = "file"
ground = "dark"
order = ["night-town", "parts", "seed-planted", "agents", "forecast", "frozen-ink", "monsters-rise", "shadow-defence", "fire-in-snow", "fusion-arrives", "cast-order", "fuse-building", "rooftop-wall", "hold-the-seed", "morning-after"]

[voices]
engine = "http://127.0.0.1:8187/v1"
transcriber = "in-memory::whisper-small.en"
narrator = { model = "in-memory::qwen3-tts", voice = "nyc", speed = 1.25, language = "en", pause = 0.6 }
user = { model = "in-memory::pocket-tts", voice = "michael", speed = 1.2 }

[timing]
fps = 30
lead = 0.3
beat = 0.8

[shot.night-town]
at = "0:00"
until = "0:06"
name = "1. A town at night"
label = "1 · A town at night"
screen = "Real clip: the crane from the two moons down to the isometric pixel town (render-path, camera-paths/moon-town-rise)."
vo = "A town under two moons, one purple, one orange. At nine this morning, it didn't exist."
source = { recording = { file = ".atelico/animatic-moves/card-01-night-town-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/world/pan.mp4", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.parts]
at = "0:06"
until = "0:23"
name = "2. Parts, not code"
label = "2 · Parts, not code"
screen = "Real: the Atelico editor with the Pixel World graph open (stands in until the marketplace install is built)."
vo = "Nine a.m. I'm Paul, and I make the Atelico editor. I ask Claude for a pixel town under two moons. It doesn't write a renderer: it installs five parts from the Atelico marketplace that are built to fit together, so adding the camera doesn't break the sky."
source = { recording = { file = ".atelico/animatic-moves/card-02-parts-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/world/editor-pixel-graph.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.seed-planted]
at = "0:23"
until = "0:36"
name = "3. Planting the seed"
label = "3 · Planting the seed"
screen = "Placeholder sketch: the seed planted, houses round it."
vo = "The one rule no part has, Claude writes: you plant a seed, and the town grows around it. If the seed breaks, the town is gone. You start with one spell: wind."
source = { recording = { file = ".atelico/animatic-moves/card-03-seed-planted-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/seed-planted.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.agents]
at = "0:36"
until = "0:49"
name = "4. Three sessions, one bug"
label = "4 · Three sessions, one bug"
screen = "Real: the game full frame from the player camera (the three Claude panes are not built yet)."
vo = "Noon. I split Claude into three sessions, monsters, spells and weather, each in its own files. The first build spawns monsters inside the houses; the monsters session fixes its own file, and nothing else changes."
source = { recording = { file = ".atelico/animatic-moves/card-04-agents-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/world/player-view.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.forecast]
at = "0:49"
until = "0:55"
name = "5. The forecast"
label = "5 · The forecast"
screen = "Real: the forecast overlay over the running game."
vo = "The sky part forecasts when the moons line up: four game days. I skip ahead."
source = { recording = { file = ".atelico/animatic-moves/card-05-forecast-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/world/forecast-in-game.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.frozen-ink]
at = "0:55"
until = "1:07"
name = "6. The world freezes"
label = "6 · The world freezes"
screen = "Placeholder sketch: warm town, then frozen ink."
vo = "Third try at this night. The moons meet. The ink-world part restyles every house, tree and townsperson in one pass. Nothing is redrawn, so nothing comes out off-style. The townsfolk freeze."
source = { recording = { file = ".atelico/animatic-moves/card-06-frozen-ink-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/frozen-ink.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.monsters-rise]
at = "1:07"
until = "1:17"
name = "7. Climbers and diggers"
label = "7 · Climbers and diggers"
screen = "Placeholder sketch: creatures rise and head for the seed."
vo = "Each moon raises its own creatures: purple ones climb over walls, orange ones dig under them. Tonight both are up, and they head for the seed."
source = { recording = { file = ".atelico/animatic-moves/card-07-monsters-rise-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/monsters-rise.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.shadow-defence]
at = "1:17"
until = "1:28"
name = "8. Shadows that fight"
label = "8 · Shadows that fight"
screen = "Real: the watchtower in the ink night throwing its shadow."
vo = "The spells session made everything a spell: a sensor and an effect. My wind is one; the watchtower is another. Sensor: a creature in its shadow. Effect: slow it."
source = { recording = { file = ".atelico/animatic-moves/card-08-shadow-defence-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/world/two-shadows.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.fire-in-snow]
at = "1:28"
until = "1:40"
name = "9. Fire in the snow"
label = "9 · Fire in the snow"
screen = "Real: burning flakes falling into the snowy town."
vo = "The weather session's rule: the purple moon brings snow, the orange one embers, and together the embers fall as fire into the snow. Every burning flake I catch is a fire spell."
source = { recording = { file = ".atelico/animatic-moves/card-09-fire-in-snow-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/world/fire-in-snow.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.fusion-arrives]
at = "1:40"
until = "1:55"
name = "10. Fusion arrives, and a dud"
label = "10 · Fusion arrives, and a dud"
screen = "Real: the town square at night, lamps lit (fusion is not built yet)."
vo = "Six p.m.: Claude installs the last part, fusion, while the night keeps running. A small AI model on the player's machine invents what two spells make. Not always something good: fire then fire, a warm glow that does nothing."
source = { recording = { file = ".atelico/animatic-moves/card-10-fusion-arrives-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/world/ink-world.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.cast-order]
at = "1:55"
until = "2:01"
name = "11. Order matters"
label = "11 · Order matters"
screen = "Placeholder sketch: fire then wind, wind then fire."
vo = "Order matters. Fire then wind: a wall of flame. Wind then fire: a fireball."
source = { recording = { file = ".atelico/animatic-moves/card-11-cast-order-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/cast-order.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.fuse-building]
at = "2:01"
until = "2:09"
name = "12. Fire into the tower"
label = "12 · Fire into the tower"
screen = "Real: the pixel town at night, the watchtower at the top (the tower spell is not built yet)."
vo = "The tower is a spell too, so I cast fire into it. The model invents a new tower: slow, then burn."
source = { recording = { file = ".atelico/animatic-moves/card-12-fuse-building-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/world/night-town.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.rooftop-wall]
at = "2:09"
until = "2:19"
name = "13. Flame on the rooftops"
label = "13 · Flame on the rooftops"
screen = "Real: burning flakes over the pixel rooftops (climbers are not built yet)."
vo = "The last wave: climbers come over the walls first. One burning flake, then wind: a wall of flame runs along the rooftops, and they fall."
source = { recording = { file = ".atelico/animatic-moves/card-13-rooftop-wall-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/world/fire-in-snow-pixel.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.hold-the-seed]
at = "2:19"
until = "2:38"
name = "14. The seed holds"
label = "14 · The seed holds"
screen = "Placeholder sketch: the beam round the seed as the moons part."
vo = "Then diggers surface right by the seed, and its ring is almost empty. The tower's shadow can't reach them, so I cast wind into it to make it move. The model invents a shadow that turns like a lighthouse beam. The last digger burns a step from the seed, and then the moons part."
source = { recording = { file = ".atelico/animatic-moves/card-14-hold-the-seed-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/hold-the-seed.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

[shot.morning-after]
at = "2:38"
until = "2:47"
name = "15. The morning after"
label = "15 · The morning after"
screen = "Placeholder sketch: the town at dawn."
vo = "Today: six parts installed, four files written by Claude. Every part, fusion included, is in the Atelico marketplace. Ask your agent for it."
source = { recording = { file = ".atelico/animatic-moves/card-15-morning-after-move.mp4", make = "talks/animatic/make-card-moves.py", timed = true, shows = ["storyboard/sketches/morning-after.png", "talks/animatic/card-moves.toml", "talks/animatic/make-card-moves.py"] } }

