# A creature that climbs over walls on its way to the seed (the purple moon's brood). Fed by its moon.
version: 1
name: climber
title: Climber
kind: creature
mana: {source: moon, allocation: 40}
container: seed
phases:
  on_start:
    - {id: me, use: body.self, output: me}
    - {id: life, use: vital.health, target: me, params: {max: 4, on_zero: vanish}}
  on_tick:
    - {id: go, use: move.toward, target: me, params: {speed: 1.1, way: climb}}
