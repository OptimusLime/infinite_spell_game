data = ["nodes.kit"]
lua = """
Pure Luau over the layout component: ui.node/column/row/text/button/input/image/face/action/merge,
the Portal themes (require("theme"), require("phone.theme")), editorial page layouts, a chat transcript
(phone.scenes.conversation), `shell`, which frames an app's render in the themed page, and `nodes`, which
builds an app's UI from its scene's nodes (node types registered by packages with nodes.register).
Fonts and icons live under themes/atelico/."""
name = "ui-kit"
provides = ["ui", "ui.editorial", "ui.form", "ui.scene", "graphics", "theme", "phone.theme", "phone.avatar", "phone.scenes.conversation", "shell", "nodes", "nodes.kit"]
requires = ["layout"]

[package]
data_types = ["theme (luau)", "icons (png)", "fonts (ttf)", "scene nodes"]
description = "Pure-Luau widget kit over layout: themed rows, columns, buttons, inputs, editorial page layouts, a chat transcript, the Portal themes, an app shell that frames any app in a themed page, and scene nodes (App, Panel, Text, Button, Input, Image, Choice, Chat) that build an app's UI from its scene."
keywords = ["ui", "widgets", "theme", "design system", "chat transcript", "shell", "scene nodes"]
permissions = []
tests = []
version = "0.1.2"

[package.dependencies]
layout = "^0.1"
