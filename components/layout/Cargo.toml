[package]
name = "component-layout"
edition = "2021"
version = "0.1.0"
license = "Commercial"

[dependencies]
atelico-component.workspace = true
atelico-paint.workspace = true
atelico-paint-cpu.workspace = true
fontdue = "0.9"
taffy = "0.10"
serde_json = "1"

# PNG retains tiny-skia decoding; JPEG uses the existing bounded image codec.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
