[package]
name = "component-scene-3d"
edition = "2021"
version = "0.1.0"
license = "Commercial"

[dependencies]
atelico-component.workspace = true
atelico-data.workspace = true
atelico-scene.workspace = true
atelico-gpu.workspace = true
atelico-render-3d.workspace = true
component-toon-character.workspace = true
component-water.workspace = true
component-sky.workspace = true
component-island-props.workspace = true
# the moon town's parts (meadow, street, plaza, houses, well, lanterns, the town seed) register themselves
component-moon-town.workspace = true
# look graphs: a Grade's post pass as a Shader Forge graph
component-world-looks.workspace = true
component-fire.workspace = true
component-arrow.workspace = true
component-particles.workspace = true
component-markov-junior.workspace = true
# the plant kinds (palm, bush, tree) and rock kinds (sea-cliff, sea-stack, boulders) register themselves
component-plant-generation.workspace = true
component-rock-generation.workspace = true
component-terrain-generation.workspace = true
# 2.5D pixel worlds: sprites and tiles through the pixel lens
component-pixel-sprites.workspace = true
# the twin moons' weather (snow, embers, fire in the snow) registers itself
component-weather.workspace = true
# the moons' broods, drawn from the spell core's town, register themselves
component-creatures.workspace = true
# the town founded: the seed planted and the first houses growing round it
component-founding.workspace = true
atelico-node-cache.workspace = true
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
toml.workspace = true
png.workspace = true
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
naga = { version = "27", features = ["wgsl-in"] }
atelico-graph.workspace = true
atelico-timeline.workspace = true
serde_yaml_ng = "0.10"
