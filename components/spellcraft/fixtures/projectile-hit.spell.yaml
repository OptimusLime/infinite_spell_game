# Engineering input fixture, not an accepted game spell or balance configuration.
version: 1
name: engineering-bolt
title: Engineering bolt
kind: spell
shape: bolt
element: wind
mana: {source: wand, allocation: 20}
container: field
phases:
  on_start:
    - {id: form, use: body.bolt, output: form}
