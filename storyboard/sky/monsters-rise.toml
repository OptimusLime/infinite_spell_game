title = "Climbers and diggers"
spoken = "Each moon raises its own creatures: purple ones climb over walls, orange ones dig under them. Tonight both are up, and they head for the seed."
shown = "The ground cracks under both moons' light; purple and orange ink creatures pull themselves up and go for the glowing seed: the purple ones scale a house wall, the orange ones sink into the ground and surface past it."
