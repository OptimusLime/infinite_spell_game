title = "A town at night"
spoken = "A town under two moons, one purple, one orange. At nine this morning, it didn't exist."
shown = "One continuous move. Start low and cinematic, looking up at the night sky: the purple moon and the orange moon big in the skybox. Pan down without a cut to the game's own camera, the high isometric view over the cosy pixel town, snow on the roofs and lamps lit. Then the character starts walking through the town, and for one second the whole town flips to frozen ink and back: a glimpse of tonight."
status = "doing"
