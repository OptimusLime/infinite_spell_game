- step: 6
  id: world/cel/frozen-ink
  file: /Users/paul/coding/infinite_spell_game/storyboard/world/cel/frozen-ink.toml
  group: world/cel
  title: The world freezes
  shot: 'Two flashes of earlier tries: creatures reach the seed, it shatters, the town greys out (corner clock 15:30, then 16:40). Then clock 17:50, a fresh try: the two moons touch in the sky. Hard cut from warm pixels to flat ink: two or three tones, hard black lines, purple and orange the only colours. People stopped mid-step, lamps gone cold. The picture stays in the game; the corner clock and any editor beat are small overlays.'
  spoken: Third try at this night. The moons meet. The ink-world part restyles every house, tree and townsperson in one pass. Nothing is redrawn, so nothing comes out off-style. The townsfolk freeze.
  estimate_s: 12.5
  duration_s: null
  sketch: /Users/paul/coding/infinite_spell_game/storyboard/sketches/frozen-ink.png
  sketch_note: 'Why the townsfolk freeze (options for Paul; spoken line unchanged). Paul: "the good guys are frozen in place. And so that means that ... your things are vulnerable". A) Defenceless town: by day the townsfolk light the lamps and man the tower; frozen, nothing defends but the spells you set up in daylight, so the forecast is your preparation window. B) Breakable people: the frozen townsfolk are ink statues; a creature that touches one shatters it, and at dawn the town is smaller, so you guard people as well as the seed. C) Light leash: you stay unfrozen only inside the seed''s glow; step out of it and you freeze like them, so every trip for a burning flake is a risk. Sketch frames: sketches/world/switch-pixel-to-ink.png and switch-pixel-to-ink.mp4 (island); the town version waits on world round 2.'
  status: doing
