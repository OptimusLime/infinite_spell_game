  title: Parts, not code
  shot: 'A clock in the corner: 9:00. The Atelico editor with one Claude pane. Typed: "a cosy pixel town under two moons, purple and orange". The marketplace panel opens; Claude ticks Pixel world, Moon town, Sky, Ink world and Camera path, and each installs. The scene view starts: the camera cranes down from the moons onto the town.'
  spoken: 'Nine a.m. I''m Paul, and I make the Atelico editor. I ask Claude for a pixel town under two moons. It doesn''t write a renderer: it installs five parts from the Atelico marketplace that are built to fit together, so adding the camera doesn''t break the sky.'
