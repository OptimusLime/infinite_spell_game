  group: world/pixel
  title: A town at night
  shot: 'One continuous move. Start low and cinematic, looking up at the night sky: the purple moon and the orange moon big in the skybox. Pan down without a cut to the game''s own camera, the high isometric view over the cosy pixel town, snow on the roofs and lamps lit. Then the character starts walking through the town.'
  spoken: A town under two moons, one purple, one orange. At nine this morning, it didn't exist.
  estimate_s: 6.5
  duration_s: null
  sketch: /Users/paul/coding/infinite_spell_game/storyboard/sketches/world/cinematic-sky.png
  sketch_note: 'The opening frame: sketches/world/cinematic-sky.png (low, up at the two moons). It pans to sketches/world/player-view.png (the isometric player view); the move itself is sketches/world/pan.mp4.'
  status: doing
- step: 2
  id: making/parts
  file: /Users/paul/coding/infinite_spell_game/storyboard/making/parts.toml
  group: making
  title: Parts, not code
  shot: 'A clock in the corner: 9:00. The Atelico editor with one Claude pane. Typed: "a cosy pixel town under two moons, purple and orange". The marketplace panel opens; Claude ticks Pixel world, Moon town, Sky, Ink world and Camera path, and each installs. The scene view starts: the camera cranes down from the moons onto the town.'
  spoken: 'Nine a.m. I''m Paul, and I make the Atelico editor. I ask Claude for a pixel town under two moons. It doesn''t write a renderer: it installs five parts from the Atelico marketplace that are built to fit together, so adding the camera doesn''t break the sky.'
  estimate_s: 19.0
