  id: world/cel/frozen-ink
  file: /Users/paul/coding/infinite_spell_game/storyboard/world/cel/frozen-ink.toml
  group: world/cel
  title: The world freezes
  shot: 'The two moons touch in the sky. Hard cut from warm pixels to flat ink: two or three tones, hard black lines, purple and orange the only colours. People stopped mid-step, lamps gone cold. From here the picture stays in the game through the night; the corner clock and any editor beat are small overlays.'
  spoken: The moons meet. The ink-world part restyles every house, tree and townsperson in one pass. Nothing is redrawn, so nothing comes out off-style. The townsfolk freeze.
  estimate_s: 10.5
  duration_s: null
