  group: town
  title: Planting the seed
  shot: 'Clock: 10:00. Claude''s pane shows one new file, seed.luau, being written. Then in the game: the player presses a glowing seed into open ground; the first houses grow up around it. The seed keeps pulsing at the town''s centre with a ring that shows its health.'
  spoken: 'The one rule no part has, Claude writes: you plant a seed, and the town grows around it. If the seed breaks, the town is gone.'
