  file: /Users/paul/coding/infinite_spell_game/storyboard/town/hold-the-seed.toml
  group: town
  title: The seed holds
  shot: Orange diggers burst up beside the seed, just outside the tower's shadow; the ring drains to a sliver. The player casts wind into the burning watchtower; its spell entry rewrites live (a new name; effect "sweep" added) and its burning shadow turns round the seed like a lighthouse beam. Each digger it crosses goes up in flames (hit-stop, shake); the last burns a step from the seed. A beat later the moons slide apart above; the ring stops at its last sliver.
  spoken: Then diggers surface right by the seed, and its ring is almost empty. The tower's shadow can't reach them, so I cast wind into it to make it move. The model invents a shadow that turns like a lighthouse beam. The last digger burns a step from the seed, and then the moons part.
