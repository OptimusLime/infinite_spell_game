shown = "Confirmed: a generic grid Inventory holds cartridge items; separate Equipment equips the wand. Load/replace a physical cartridge, select an authored spell and spend finite energy to cast. The bottom panel sums remaining inventory-cartridge energy without counting an item twice. Magical inventory expanders consume mana; capacity and rates remain open."
