title = "Flame on the rooftops"
spoken = "The last wave: climbers come over the walls. I fuse in a hurry, wind then fire, and the fireball sails over them. One more flake, fire then wind: a wall of flame along the rooftops, and they fall."
shown = "Purple climbers top the house walls and cross the roofs toward the seed. The player rushes a cast: wind then fire; the fireball arcs over the roofline and bursts harmlessly in the street behind; the ring drops. The player catches another falling flake and casts fire then wind: a wall of flame runs along the roofline and the climbers fall burning. The seed's ring has drained to a quarter."
status = "todo"
sketch_note = "Needs climbers, the catchable flake and fusion; nothing to capture yet."
